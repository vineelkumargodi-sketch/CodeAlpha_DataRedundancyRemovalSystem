services:
  - type: web
    name: codealpha-data-redundancy-removal-system
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codealpha-data-redundancy-db
          property: connectionString


databases:
  - name: codealpha-data-redundancy-db
    plan: free
    region: singapore